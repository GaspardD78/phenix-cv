name: CI

# Valide le code et le build Windows. Aucune publication de Release.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances
        run: bun install --frozen-lockfile

      - name: Typage strict
        run: bunx tsc --noEmit

      - name: Tests
        run: bun test

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Tests Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build de l'application Windows (sans publication)
        run: bun run tauri build

      # Auto-test de l'export PDF avec l'application construite (fenêtre WebView2 réelle, Edge, Chrome).
      - name: Installer pypdf
        run: python -m pip install pypdf

      - name: Export PDF — WebView2 (voie principale)
        shell: pwsh
        run: ./scripts/selftest-pdf.ps1 -Method webview2

      - name: Export PDF — mode automatique (doit utiliser WebView2)
        shell: pwsh
        run: ./scripts/selftest-pdf.ps1 -Method auto -Expected webview2

      - name: Export PDF — repli Edge
        shell: pwsh
        run: ./scripts/selftest-pdf.ps1 -Method edge

      - name: Export PDF — repli Chrome
        continue-on-error: true
        shell: pwsh
        run: ./scripts/selftest-pdf.ps1 -Method chrome

      - name: Conserver les PDF d'essai (3 jours)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phenix-cv-pdf-essais
          path: selftest-out/
          if-no-files-found: warn
          retention-days: 3

      # Installateur de test, téléchargeable depuis l'onglet « Actions » (aucune Release publiée).
      - name: Conserver l'installateur (3 jours)
        uses: actions/upload-artifact@v4
        with:
          name: phenix-cv-windows-installateur
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 3
